<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TermAPK</title>
<style>
  :root{
    --bg: #121213;
    --tile: #3a3a3c;
    --text: #e6e6e6;
    --kbd-bg: #818384;
    --absent: #3a3a3c;
    --present: #b59f3b;
    --correct: #538d4e;
    --border: #3a3a3c;
    --accent: #6ca0ff;
    --toast-bg: rgba(0,0,0,.85);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg: #f2f2f2;
      --tile: #d3d6da;
      --text: #111;
      --kbd-bg: #d3d6da;
      --absent: #787c7e;
      --present: #c9b458;
      --correct: #6aaa64;
      --border: #d3d6da;
      --toast-bg: rgba(0,0,0,.85);
    }
  }
  *{box-sizing:border-box}
  html, body{height:100%}
  html, body, main, .board, .keyboard, .row, .tile, .key, .toast, dialog{
    user-select:none;
    -webkit-user-select:none;
    -ms-user-select:none;
    -webkit-touch-callout:none;
  }
  body{
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol","Noto Color Emoji";
    color:var(--text);
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    overflow:hidden;
  }
  header{
    width:100%;
    max-width:560px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    gap:8px;
  }
  header h1{
    font-size:20px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin:0;
  }
  .btn{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    cursor:pointer;
    font-weight:600;
  }
  .btn.primary{
    background:var(--accent);
    color:#fff;
    border:0;
  }
  .tile.cursor{
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .tile.disabled {
    opacity: 0.3; /* visual apagado */
    pointer-events: none; /* não clicável */
  }
  main{
    width:100%;
    max-width:1600px;
    min-width:0;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding:0 12px max(10px, env(safe-area-inset-bottom));
    overflow:hidden;
  }
  .topbar{
    width:100%;
    max-width:360px;
    display:flex;
    justify-content:center;
    padding-top:8px;
    flex:0 0 auto;
  }
  .boards-wrap{
    width:100%;
    max-width:100%;
    display:grid;
    gap:12px;
    align-items:start;
    justify-content:center;
    min-height:0;
    flex:1 1 auto;
    overflow:hidden;
    padding:2px 4px;
  }
  .boards-wrap.solo{
    grid-template-columns: 1fr;
  }
  .boards-wrap.dueto{
    grid-template-columns: repeat(2, minmax(0, 1fr));
    max-width:920px;
  }
  .boards-wrap.quarteto{
    grid-template-columns: repeat(4, minmax(0, 1fr));
    max-width:1500px;
    gap:10px;
  }
  .boards-wrap.dueto .board{
    max-width:195px;
    gap:4px;
    margin-top:0;
  }
  .boards-wrap.quarteto .board{
    max-width:145px;
    gap:2px;
    margin-top:0;
  }
  .boards-wrap.dueto .tile{
    border-radius:8px;
    font-size:1.45rem;
  }
  .boards-wrap.quarteto .tile{
    border-radius:7px;
    font-size:1rem;
  }
  @media (min-width:601px){
    .boards-wrap.dueto .board{
      max-width:min(420px, calc((100dvh - 235px) * .714));
    }
    .boards-wrap.quarteto .board{
      max-width:min(330px, calc((100dvh - 235px) * .555));
    }
  }
  .boards-wrap.mode-transition{
    animation: modeSwitch .24s ease;
  }
  .board-shell{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:0;
    width:100%;
    min-width:0;
  }
  .board-area{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:4px;
    width:100%;
    min-width:0;
  }
  .relevant-letters{
    display:flex;
    flex:0 0 22px;
    flex-direction:column;
    align-self:stretch;
    justify-content:center;
    gap:3px;
    width:22px;
    transition:opacity .2s ease, filter .2s ease;
  }
  .board-shell.solved .relevant-letters{
    opacity:.3;
    filter:grayscale(1);
  }
  .relevant-letter{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    aspect-ratio:1;
    border-radius:5px;
    color:#fff;
    font-size:.78rem;
    font-weight:800;
    line-height:1;
    text-transform:uppercase;
  }
  .relevant-letter.present{background:var(--present);}
  .relevant-letter.correct{background:var(--correct);}
  .boards-wrap.solo .relevant-letters{display:none;}
  .boards-wrap.solo .board{
    margin-top:4px;
    max-width:272px;
  }

  /* Grade */
  .board{
    display:grid;
    grid-template-columns: repeat(var(--cols,5), minmax(0, 1fr));
    width:100%;
    gap:5px;
    margin-top:8px;
    touch-action:manipulation;
  }
  .tile{
    min-width:0;
    aspect-ratio:1;
    border:2px solid var(--border);
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    padding-bottom:5px;
    text-transform:uppercase;
    font-weight:800;
    font-size:2.0rem;
    user-select:none;
    background:transparent;
    color:var(--text);
    cursor:default;
  }
  .tile.clickable{
    cursor:pointer;
  }
  .tile.filled{ border-color:#9aa0a6; }
  .tile.absent{ background:var(--absent); border-color:var(--absent); color:#fff;}
  .tile.present{ background:var(--present); border-color:var(--present); color:#fff;}
  .tile.correct{ background:var(--correct); border-color:var(--correct); color:#fff;}

  /* Animações */
  .shake{ animation: shake .3s linear; }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
  }
  .flip{
    transform: rotateX(90deg);
    transition: transform .15s ease-in;
  }
  .flip.show{
    transform: rotateX(0);
    transition: transform .15s ease-out;
  }
  .pop{ animation: pop .08s ease-out; }
  @keyframes pop{
    from{transform:scale(0.9)}
    to{transform:scale(1)}
  }
  .winpop{ animation: winpop .35s ease; }
  @keyframes winpop{
    0%{transform:scale(1)}
    50%{transform:scale(1.15)}
    100%{transform:scale(1)}
  }

  /* Teclado */
  .keyboard{
    display:flex;
    flex-direction:column;
    gap:6px;
    width:100%;
    max-width:560px;
    min-width:0;
    flex:0 0 auto;
  }
  .row{
    display:flex;
    justify-content:center;
    gap:6px;
    width:100%;
    min-width:0;
  }
  .key{
    background:var(--kbd-bg);
    color:#000;
    border:0;
    border-radius:6px;
    padding:7px 4px;
    font-weight:700;
    font-size: 20px;
    min-width:0;
    width:0;
    height:38px;
    flex:1 1 0;
    cursor:pointer;
    user-select:none;
    text-transform:uppercase;
  }
  .key.big{ flex-grow:1.55; }
  .key.dark{ background:var(--absent); color:#fff; }
  .key.present{ background:var(--present); color:#fff; }
  .key.correct{ background:var(--correct); color:#fff; }
  .key.manual-off,
  .key.discarded{
    opacity:.35;
    filter: grayscale(1);
  }
  .key.keyflash{
    animation: keyflash .26s ease;
  }
  .key.keyflash-error{
    animation:none;
    background:#e05555 !important;
    color:#fff !important;
    opacity:1 !important;
    filter:none !important;
    transform:scale(1.04);
    transition:background-color .06s ease, color .06s ease, opacity .06s ease, transform .06s ease;
  }
  .key .key-symbol{
    display:inline-block;
    position:relative;
    top:-4px;
    transition: transform .18s ease;
  }
  .key.keyflip-delete .key-symbol{
    transform: rotate(180deg);
  }
  @keyframes keyflash{
    0%{
      background:var(--kbd-bg);
      color:#111;
      transform:scale(1);
    }
    45%{
      background:#5aa9ff;
      color:#fff;
      transform:scale(1.04);
    }
    100%{
      background:var(--kbd-bg);
      color:#111;
      transform:scale(1);
    }
  }
  @keyframes keyflashError{
    0%{
      background:var(--kbd-bg);
      color:#111;
      transform:scale(1);
    }
    45%{
      background:#e05555;
      color:#fff;
      opacity:1;
      transform:scale(1.04);
    }
    100%{
      background:var(--kbd-bg);
      color:#111;
      transform:scale(1);
    }
  }

  @keyframes modeSwitch{
    0%{ opacity:.35; transform:scale(.985); }
    100%{ opacity:1; transform:scale(1); }
  }

  @media (max-width:600px){
    main{
      max-width:none;
      gap:8px;
      padding-inline:6px;
      padding-bottom:max(6px, env(safe-area-inset-bottom));
    }
    .topbar{
      max-width:360px;
      padding-top:4px;
    }
    .btn{padding:7px 9px;}
    .keyboard{ gap:4px; max-width:520px; }
    .row{ gap:3px; }
    .key{
      height:clamp(22px, 3.5vh, 28px);
      padding:4px 2px;
      font-size:clamp(10px, 3vw, 14px);
    }
    .boards-wrap.solo .board{max-width:252px;}
    .board{gap:clamp(2px, .8vw, 4px);}
    .boards-wrap.dueto{
      grid-template-columns:repeat(2, minmax(0, 1fr));
      max-width:500px;
      gap:8px;
    }
    .boards-wrap.quarteto{
      grid-template-columns: repeat(2, minmax(0, 1fr));
      max-width:500px;
      gap:6px 8px;
      align-content:space-evenly;
    }
    .boards-wrap.dueto .board{
      max-width:min(88%, 185px);
      gap:clamp(2px, .7vw, 4px);
    }
    .boards-wrap.dueto .tile{
      border-radius:clamp(4px, 1.6vw, 8px);
      font-size:clamp(.82rem, 5vw, 1.45rem);
    }
    .boards-wrap.quarteto .board{
      max-width:min(88%, calc((100dvh - 128px) * .235));
      gap:clamp(1px, .6vw, 3px);
    }
    .boards-wrap.quarteto .tile{
      border-radius:clamp(3px, 1.4vw, 7px);
      font-size:clamp(.72rem, 4.4vw, 1.2rem);
    }
    .board-area{gap:clamp(2px, .7vw, 4px);}
    .relevant-letters{
      flex-basis:clamp(15px, 4vw, 20px);
      width:clamp(15px, 4vw, 20px);
      gap:2px;
    }
    .relevant-letter{
      border-radius:4px;
      font-size:clamp(.55rem, 2.5vw, .72rem);
    }
    .tile{padding-bottom:2px; border-width:1.5px;}
  }

  @media (max-width:600px) and (orientation:landscape){
    .boards-wrap.quarteto{
      grid-template-columns:repeat(4, minmax(0, 1fr));
      max-width:900px;
      gap:6px;
    }
    .boards-wrap.quarteto .board{max-width:145px;}
    .topbar{padding-top:2px;}
    .key{height:34px; font-size:13px;}
    .keyboard{gap:3px;}
  }

  /* Toast / Modal */
  .toast{
    position:fixed;
    top:16px; left:50%;
    transform:translateX(-50%);
    background:var(--toast-bg);
    color:#fff;
    padding:10px 14px;
    border-radius:8px;
    opacity:0;
    pointer-events:none;
    transition: opacity .2s ease;
    font-weight:600;
    z-index:5;
    width:max-content;
    max-width:calc(100vw - 24px);
    text-align:center;
  }
  .toast.show{ opacity:1; }
  dialog{
    border:1px solid var(--border);
    border-radius:12px;
    padding:16px;
    background:var(--bg);
    color:var(--text);
    width:min(92vw, 520px);
    max-height:calc(100dvh - 24px);
    overflow:auto;
  }
  dialog::backdrop{ background: rgba(0,0,0,.5); }
  .stats{
    display:grid; grid-template-columns: repeat(4,1fr); gap:8px; margin-top:8px;
  }
  .stat{
    text-align:center; border:1px solid var(--border); border-radius:8px; padding:8px;
  }
  .small{ opacity:.9; font-size:.92rem; }
  @media (max-width:420px){
    .stats{grid-template-columns:repeat(2, 1fr);}
  }
  @media (prefers-reduced-motion:reduce){
    *, *::before, *::after{
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
      scroll-behavior:auto !important;
    }
  }
</style>
</head>

  <main>

      <button class="btn" id="btnMode">Modo: Normal</button>
    </div>

    <div id="boardsWrap" class="boards-wrap solo">

    </div>

    <div class="keyboard" id="keyboard"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <dialog id="dlgEnd">
    <h2 id="endTitle">Parabéns!</h2>
    <p id="endMsg" class="small"></p>
    <div class="stats">
      <div class="stat"><div class="small">Jogos</div><div id="stGames" style="font-size:1.4rem; font-weight:800;">0</div></div>

      <div class="stat"><div class="small">Sequência</div><div id="stStreak" style="font-size:1.4rem; font-weight:800;">0</div></div>
      <div class="stat"><div class="small">Máx. Seq.</div><div id="stMax" style="font-size:1.4rem; font-weight:800;">0</div></div>
    </div>
    <div style="display:flex; gap:8px; margin-top:12px; justify-content:flex-end;">
      <button class="btn" id="btnAgain">Jogar de novo</button>
    </div>
  </dialog>

// Subconjunto de soluções (pode ser a própria lista).
const SOLUTIONS = WORDS;

/* ===================== UTILITÁRIOS ===================== */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

const normalize = (s) =>
  (s || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ç/g,"c").replace(/Ç/g,"C");

const isAlphaPt = (ch) => /[A-Za-zÀ-ÖØ-öø-ÿÇç]/.test(ch);

function showToast(msg, ms=1400){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> t.classList.remove("show"), ms);
}

function flashKey(k, mode="normal"){
  const raw = String(k || "");
  const upper = raw.toUpperCase();
  const btn =
    $(`.key[data-key="${raw}"]`) ||
    $(`.key[data-key="${upper}"]`);
  if(!btn) return;
  clearTimeout(btn._flashTimer);
  btn.classList.remove("keyflash", "keyflash-error");
  // reinicia a animação mesmo em toques rápidos sucessivos
  void btn.offsetWidth;
  const cls = mode === "error" ? "keyflash-error" : "keyflash";
  btn.classList.add(cls);
  btn._flashTimer = setTimeout(()=> btn.classList.remove("keyflash", "keyflash-error"), 280);
}

function flipBackspaceSymbol(){
  const btn = $('.key[data-key="Backspace"]');
  if(!btn) return;
  clearTimeout(btn._flipTimer);
  btn.classList.remove("keyflip-delete");
  void btn.offsetWidth;
  btn.classList.add("keyflip-delete");
  btn._flipTimer = setTimeout(()=> btn.classList.remove("keyflip-delete"), 220);
}

function isDiscardedLetter(k){
  const upper = String(k || "").toUpperCase();
  if(upper.length !== 1 || !isAlphaPt(upper)) return false;
  const btn = $(`.key[data-key="${upper}"]`);
  return colorKeyboard.get(upper) === "absent" ||
    btn?.classList.contains("manual-off") ||
    btn?.classList.contains("discarded");
}

/* ===================== ESTADO ===================== */
let currentRow = 0;
let currentCol = 0;
let boardsState = []; // [{ el, grid, solution, solved }]
let gameOver = false;
let inputLocked = false;
let currentMode = "solo";

const stats = {
  games: 0,
  wins: 0,
  streak: 0,
  maxStreak: 0
};
function loadStats(){
  try{
    const s = JSON.parse(localStorage.getItem("mini-termo-stats")||"{}");
    Object.assign(stats, s);
  }catch{}
}
function saveStats(){
  localStorage.setItem("mini-termo-stats", JSON.stringify(stats));
}

/* ===================== INICIALIZAÇÃO ===================== */
function modeCfg(){
  return GAME_MODES[currentMode];
}
function getMaxTries(){
  return modeCfg().tries;
}
function pickSolution(){
  const idx = Math.floor(Math.random() * SOLUTIONS.length);
  return SOLUTIONS[idx].toUpperCase();
}
function updateModeButton(){
  const btn = $("#btnMode");
  if(!btn) return;
  btn.textContent = `Modo: ${modeCfg().label}`;
}
function applyModeVisual(){
  const wrap = $("#boardsWrap");
  if(!wrap) return;
  wrap.classList.remove("solo", "dueto", "quarteto");
  wrap.classList.add(currentMode);
}
function triggerModeTransition(){
  const wrap = $("#boardsWrap");
  if(!wrap) return;
  wrap.classList.remove("mode-transition");
  void wrap.offsetWidth;
  wrap.classList.add("mode-transition");
  clearTimeout(wrap._modeTimer);
  wrap._modeTimer = setTimeout(() => wrap.classList.remove("mode-transition"), 260);
}
function setMode(mode){
  if(!GAME_MODES[mode] || mode === currentMode) return;
  const dlg = $("#dlgEnd");
  if(dlg?.open) dlg.close();
  currentMode = mode;
  triggerModeTransition();
  resetGame();
}
function toggleMode(){
  if(inputLocked) return;
  const order = ["solo", "dueto", "quarteto"];
  const idx = order.indexOf(currentMode);
  const next = order[(idx + 1) % order.length];
  setMode(next);
}
function buildBoards(){
  const wrap = $("#boardsWrap");
  wrap.innerHTML = "";
  boardsState = [];
  applyModeVisual();

  const count = modeCfg().boards;
  const used = new Set();
  for(let b=0; b<count; b++){
    const shell = document.createElement("div");
    shell.className = "board-shell";

    const boardArea = document.createElement("div");
    boardArea.className = "board-area";
    shell.appendChild(boardArea);

    const board = document.createElement("div");
    board.className = "board";
    board.style.setProperty("--cols", WORD_LENGTH);
    board.setAttribute("role", "grid");
    board.setAttribute("aria-label", count === 1 ? "Palavra" : `Palavra ${b + 1}`);
    boardArea.appendChild(board);

    const relevantEl = document.createElement("div");
    relevantEl.className = "relevant-letters";
    relevantEl.setAttribute("aria-label", `Letras relevantes da palavra ${b + 1}`);
    relevantEl.setAttribute("aria-live", "polite");
    boardArea.appendChild(relevantEl);
    wrap.appendChild(shell);

    const boardState = {
      shell,
      el: board,
      grid: [],
      solution: "",
      solved: false,
      revealed: [],
      relevantEl,
      relevantLetters: new Map(),
      relevantOrder: [],
      relevantEvents: []
    };

    for(let r=0; r<getMaxTries(); r++){
      const row = [];
      for(let c=0; c<WORD_LENGTH; c++){
        const d = document.createElement("div");
        d.className = "tile";
        if(r > currentRow) d.classList.add("disabled");
        d.dataset.row = r;
        d.dataset.col = c;
        d.dataset.board = b;
        d.addEventListener("click", () => {
          if(gameOver || inputLocked || boardState.solved) return;
          if(r !== currentRow) return;
          currentCol = c;
          cursorActive = true;
          updateCursor();
        });
        d.setAttribute("aria-label",`Letra ${c+1} da tentativa ${r+1}`);
        board.appendChild(d);
        row.push(d);
      }
      boardState.grid.push(row);
    }

    let chosen = pickSolution();
    while(used.has(chosen) && used.size < SOLUTIONS.length){
      chosen = pickSolution();
    }
    used.add(chosen);
    boardState.solution = chosen;
    boardsState.push(boardState);
  }
}

function buildKeyboard(){
  const rows = [
    "Q W E R T Y U I O P".split(" "),
    "A S D F G H J K L Backspace".split(" "),
    [..."Z X C V B N M".split(" "), "Enter"]
  ];
  const kb = $("#keyboard");
  kb.innerHTML = "";
  rows.forEach((letters,i)=>{
    const row = document.createElement("div");
    row.className = "row";
    letters.forEach(key=>{
      const b = document.createElement("button");
      b.className = "key";
      if(key === "Backspace"){
        b.innerHTML = '<span class="key-symbol">⌫</span>';
      }else{
        b.textContent = key;
      }
      if(key === "Enter" || key === "Backspace") b.classList.add("big");
      b.dataset.key = key;
      b.addEventListener("click", onVirtualKey);
      b.addEventListener("contextmenu", onVirtualKeyRightClick);
      b.addEventListener("touchstart", onVirtualKeyTouchStart, { passive: false });
      b.addEventListener("touchend", onVirtualKeyTouchEnd, { passive: false });
      b.addEventListener("touchmove", onVirtualKeyTouchCancel, { passive: false });
      b.addEventListener("touchcancel", onVirtualKeyTouchCancel, { passive: false });
      row.appendChild(b);
    });
    kb.appendChild(row);
  });
}

function resetGame(){
  currentRow = 0;
  currentCol = 0;
  cursorActive = true;
  gameOver = false;
  inputLocked = false;

  buildBoards();
  updateModeButton();

  updateActiveRowVisual();
  updateCursor();

  // Limpa estado interno do teclado
  colorKeyboard.clear();
  $$(".key").forEach(key => key.classList.remove("dark", "present", "correct", "manual-off", "discarded"));

  updateInfo();
}

function updateInfo(){
  const info = $("#info");
  if(!info) return;
  if(!gameOver){
    info.innerHTML = `Acerte ${modeCfg().boards === 2 ? "as duas palavras" : "a palavra"} de <b>${WORD_LENGTH}</b> letras em até <b>${getMaxTries()}</b> tentativas.`;
  }
}

/* ===================== ENTRADA ===================== */
function onVirtualKey(e){
  if(e.currentTarget.dataset.suppressClick === "1"){
    e.currentTarget.dataset.suppressClick = "0";
    e.currentTarget.dataset.skipNextFlash = "0";
    return;
  }
  const k = e.currentTarget.dataset.key;
  if(k !== "Enter"){
    if(e.currentTarget.dataset.skipNextFlash === "1"){
      e.currentTarget.dataset.skipNextFlash = "0";
      clearTimeout(e.currentTarget._skipFlashTimer);
    }else{
      flashKey(k, isDiscardedLetter(k) ? "error" : "normal");
    }
  }
  handleKey(k);
}
function onVirtualKeyRightClick(e){
  e.preventDefault();
  toggleManualKeyState(e.currentTarget);
}
function onVirtualKeyTouchStart(e){
  const btn = e.currentTarget;
  clearTimeout(btn._longPressTimer);
  btn._longPressTriggered = false;
  btn._longPressTimer = setTimeout(() => {
    btn._longPressTriggered = true;
    btn.dataset.suppressClick = "1";
    toggleManualKeyState(btn);
  }, KEY_LONG_PRESS_MS);
}
function onVirtualKeyTouchEnd(e){
  const btn = e.currentTarget;
  clearTimeout(btn._longPressTimer);
  if(btn._longPressTriggered){
    e.preventDefault();
  }else{
    const key = btn.dataset.key;
    if(key?.length === 1 && isDiscardedLetter(key)){
      flashKey(key, "error");
      btn.dataset.skipNextFlash = "1";
      clearTimeout(btn._skipFlashTimer);
      btn._skipFlashTimer = setTimeout(() => {
        btn.dataset.skipNextFlash = "0";
      }, 800);
    }
  }
  btn._longPressTriggered = false;
}
function onVirtualKeyTouchCancel(e){
  const btn = e.currentTarget;
  clearTimeout(btn._longPressTimer);
  clearTimeout(btn._skipFlashTimer);
  btn.dataset.skipNextFlash = "0";
  btn._longPressTriggered = false;
}
function toggleManualKeyState(btn){
  if(gameOver) return false;

  const key = btn.dataset.key;

  // Apenas letras podem ser alternadas manualmente.
  if(!key || key.length !== 1 || !isAlphaPt(key)) return false;

  // Letras já bloqueadas pelo jogo (ausentes) não podem ser alternadas.
  if(colorKeyboard.get(key) === "absent") return false;

  btn.classList.toggle("manual-off");
  return true;
}
function handleKey(k){
  if(gameOver || inputLocked) return;

  if(k === "Enter"){
    submitGuess();
    return;
  }
  if(k === "Backspace"){
    backspace();
    return;
  }

  if(k.length === 1){
    const ch = k;
    if(isAlphaPt(ch)){
      addLetter(ch);
    }
  }
}

function getPlayableBoards(){
  return boardsState.filter(b => !b.solved);
}

function addLetter(ch) {
  if(inputLocked || !cursorActive) return;
  const rowBoards = getPlayableBoards();
  if(rowBoards.length === 0) return;

  rowBoards.forEach(board => {
    const tile = board.grid[currentRow]?.[currentCol];
    if(!tile) return;
    tile.textContent = ch.toUpperCase();
    tile.classList.add("filled","pop");
    setTimeout(()=> tile.classList.remove("pop"), 80);
  });

  // Procura o próximo tile vazio à direita
  const row = rowBoards[0].grid[currentRow] || [];
  let nextCol = row.findIndex((t, i) => i > currentCol && !t.textContent);

  // Se não encontrou à direita, procura da esquerda para a direita
  if (nextCol === -1) {
    nextCol = row.findIndex(t => !t.textContent);
  }

  // Atualiza currentCol ou desativa cursor se não houver nenhum vazio
  if (nextCol !== -1) {
    currentCol = nextCol;
    cursorActive = true;
  } else {
    cursorActive = false; // linha cheia
  }

  updateCursor();
}

function backspace() {
  if(inputLocked) return;
  const rowBoards = getPlayableBoards();
  if(rowBoards.length === 0) return;
  // se o cursor está desativado, reativa antes
  if(!cursorActive) {
    cursorActive = true;
    // garante que o cursor aponte para o último tile
    currentCol = WORD_LENGTH - 1;
  }

  const tile = rowBoards[0].grid[currentRow]?.[currentCol];
  if(!tile) return;

  if (tile.textContent) {
    rowBoards.forEach(board => {
      const t = board.grid[currentRow]?.[currentCol];
      if(!t) return;
      t.textContent = "";
      t.classList.remove("filled");
    });
  } else if (currentCol > 0) {
    currentCol--;
    rowBoards.forEach(board => {
      const prevTile = board.grid[currentRow]?.[currentCol];
      if(!prevTile) return;
      prevTile.textContent = "";
      prevTile.classList.remove("filled");
    });
  }

  updateCursor();
}

function deleteLetter() {
  if(inputLocked) return;
  const rowBoards = getPlayableBoards();
  if(rowBoards.length === 0) return;
  // se o cursor está desativado, reativa antes
  if (!cursorActive) {
    cursorActive = true;
    // garante que o cursor aponte para o primeiro tile
    currentCol = 0;
  }

  const tile = rowBoards[0].grid[currentRow]?.[currentCol];
  if(!tile) return;

  if (tile.textContent) {
    // apaga a letra do tile atual
    rowBoards.forEach(board => {
      const t = board.grid[currentRow]?.[currentCol];
      if(!t) return;
      t.textContent = "";
      t.classList.remove("filled");
    });
  } else if (currentCol < WORD_LENGTH - 1) {
    // move para frente e apaga o próximo tile
    currentCol++;
    rowBoards.forEach(board => {
      const nextTile = board.grid[currentRow]?.[currentCol];
      if(!nextTile) return;
      nextTile.textContent = "";
      nextTile.classList.remove("filled");
    });
  }

  updateCursor();
}

const RULES = {
  "length": 5,
  "requireVowel": true,
  "forbiddenLetters": [ "K", "W", "Y" ],
  "qMustHaveU": true,
  "forbiddenSequences": [ "NP", "NB", "FC", "TC", "MN", "PF", "VC" ],
  "allowedDouble": [ "RR", "SS" ],
  "maxConsonantsInRow": "3",
  "forbiddenStart": [
    "BN", "BT", "CT", "DL", "FN", "GN", "KT", "TM", "VT", "ZX", "Ç", "DV", "TM",
    "BD", "PT", "MP"
  ],
  "forbiddenEnd": [ "H", "Q", "F", "T", "P", "D", "G", "J", "C", "V", "B", "Ç" ],
  "bannedWords": [ "JANJA", "CROTE", "FRACI", "LISSO" ]
};

/* ===================== REGRAS E AVALIAÇÃO ===================== */
function evaluate(guessRaw, targetRaw){
  // Usar formas normalizadas para avaliar com duplicatas.
  const guess = normalize(guessRaw).toUpperCase();
  const target = normalize(targetRaw).toUpperCase();
  const result = Array(WORD_LENGTH).fill("absent");

  const counts = {}; // contagem das letras do alvo
  for(let i=0;i<WORD_LENGTH;i++){
    const t = target[i];
    counts[t] = (counts[t]||0) + 1;
  }
  // Primeiro: posições corretas
  for(let i=0;i<WORD_LENGTH;i++){
    if(guess[i] === target[i]){
      result[i] = "correct";
      counts[guess[i]]--;
    }
  }
  // Segundo: presentes fora de lugar
  for(let i=0;i<WORD_LENGTH;i++){
    if(result[i] === "correct") continue;
    const g = guess[i];
    if(counts[g] > 0){
      result[i] = "present";
      counts[g]--;
    }else{
      result[i] = "absent";
    }
  }
  return result;
}

function isValidWord(guess){
  const g = normalize(guess).toUpperCase();
  const R = RULES;

  if(g.length !== R.length) return false;
  if(!/^[A-ZÇ]+$/.test(g)) return false;

  if(R.requireVowel && !/[AEIOU]/.test(g)) return false;

  if(R.forbiddenLetters?.some(l => g.includes(l))) return false;

  if(R.qMustHaveU){
    for(let i=0;i<g.length;i++){
      if(g[i] === "Q"){
        const next = g[i+1];
        const next2 = g[i+2];

        if(next !== "U") return false;
        if(!/[AEIO]/.test(next2)) return false;
      }
    }
  }

  if(R.forbiddenSequences?.some(seq => g.includes(seq))) return false;

  if(R.allowedDouble){
    for(let i=0;i<g.length-1;i++){
      if(g[i]===g[i+1] && !R.allowedDouble.includes(g[i]+g[i+1])){
        return false;
      }
    }
  }

  if(R.maxConsonantsInRow){
    let c = 0;
    for(const ch of g){
      if(!/[AEIOU]/.test(ch)){
        c++;
        if(c > R.maxConsonantsInRow) return false;
      } else c = 0;
    }
  }

  if(R.allowedClusters){
    for(let i=0;i<g.length-1;i++){
      const a = g[i], b = g[i+1];
      if(!/[AEIOU]/.test(a) && !/[AEIOU]/.test(b)){
        const p = a+b;
        if(!R.allowedClusters.includes(p) &&
           !R.allowedDouble?.includes(p) &&
           !["CH","LH","NH"].includes(p)){
          return false;
        }
      }
    }
  }

  if(R.forbiddenStart?.some(s => g.startsWith(s))) return false;
  if(R.forbiddenEnd?.some(e => g.endsWith(e))) return false;
  if(R.bannedWords?.includes(g)) return false;

  return true;
}

/* ===================== SUBMISSÃO ===================== */
let cursorActive = true; // nova flag para controlar se o cursor está ativo

function updateCursor() {
  $$(".tile").forEach(t => t.classList.remove("cursor"));
  if(!cursorActive) return;
  getPlayableBoards().forEach(board => {
    const tile = board.grid[currentRow]?.[currentCol];
    if(tile) tile.classList.add("cursor");
  });
}

function updateActiveRowVisual() {
  boardsState.forEach(board => {
    board.grid.forEach((row, r) => {
      row.forEach(tile => {
        tile.classList.remove("clickable");
        if(board.solved){
          tile.classList.add("disabled");
          return;
        }
        if(r === currentRow){
          tile.classList.remove("disabled");
          tile.classList.add("clickable");
        } else if(r > currentRow){
          tile.classList.add("disabled");
        } else {
          tile.classList.remove("disabled");
        }
      });
    });
  });
}

function getCurrentGuess(){
  const sourceBoard = getPlayableBoards()[0] || boardsState[0];
  if(!sourceBoard) return "";
  return (sourceBoard.grid[currentRow] || []).map(tile => tile.textContent || "").join("");
}

function submitGuess() {
  if(inputLocked) return;
  const guess = getCurrentGuess();
  if (guess.length < WORD_LENGTH) {
    flashKey("Enter", "error");
    shakeRow(currentRow);
    showToast("Faltam letras");
    return;
  }
  if (!isValidWord(guess)) {
    flashKey("Enter", "error");
    shakeRow(currentRow);
    showToast("Palavra não reconhecida");
    return;
  }

  flashKey("Enter", "normal");
  inputLocked = true;
  const evaluations = getPlayableBoards().map(board => {
    const outcome = evaluate(guess, board.solution);
    board.revealed.push({ guess, outcome: [...outcome] });
    revealRow(board, currentRow, outcome);
    return { board, outcome };
  });

  // tempo total da animação
  const revealTime = WORD_LENGTH * 260 + 150;

  setTimeout(() => {
    evaluations.forEach(({ board, outcome }) => {
      const solved = outcome.every(s => s === "correct");
      if(solved){
        board.solved = true;
        board.shell.classList.add("solved");
        animateWinRow(board, currentRow);
      }
    });
    rebuildKeyboardFromActiveBoards();
    const won = boardsState.length > 0 && boardsState.every(board => board.solved);
    if (won) {
      setTimeout(() => endGame(true, currentRow + 1), WORD_LENGTH * 120 + 220);
      return;
    }

    // Se passou do limite de tentativas, derrota
    if (currentRow >= getMaxTries() - 1) {
      endGame(false, getMaxTries());
      return;
    }

    // Próxima linha apenas se ainda houver tentativas
    currentRow++;
    currentCol = 0;
    updateActiveRowVisual();
    cursorActive = true;
    inputLocked = false;
    updateCursor();

  }, revealTime);
}

function animateWinRow(board, rowIdx){
  const tiles = board.grid[rowIdx] || [];
  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.classList.remove("winpop");
      // força reflow para reiniciar animação mesmo em vitórias seguidas
      void tile.offsetWidth;
      tile.classList.add("winpop");
      setTimeout(() => tile.classList.remove("winpop"), 360);
    }, i * 120);
  });
}

function updateRelevantLetters(board, letter, state, rowIdx){
  if(currentMode === "solo" || !board?.relevantEl) return;
  if(state !== "present" && state !== "correct") return;
  letter = String(letter || "").toUpperCase();
  if(!letter) return;
  board.relevantEvents.push({ letter, state, rowIdx });
  if(!board.relevantOrder.includes(letter)) board.relevantOrder.push(letter);

  const discovered = new Map();
  const rows = new Map();
  board.relevantEvents.forEach(event => {
    if(!rows.has(event.rowIdx)) rows.set(event.rowIdx, []);
    rows.get(event.rowIdx).push(event);
  });
  rows.forEach(events => {
    const perGuess = new Map();
    events.forEach(event => {
      const counts = perGuess.get(event.letter) || { total:0, correct:0 };
      counts.total++;
      if(event.state === "correct") counts.correct++;
      perGuess.set(event.letter, counts);
    });
    perGuess.forEach((counts, letter) => {
      const best = discovered.get(letter) || { total:0, correct:0 };
      best.total = Math.max(best.total, counts.total);
      best.correct = Math.max(best.correct, counts.correct);
      discovered.set(letter, best);
    });
  });

  board.relevantEl.innerHTML = "";
  board.relevantLetters.clear();
  board.relevantOrder.forEach(letter => {
    const counts = discovered.get(letter);
    if(!counts) return;
    const items = [];
    for(let occurrence=0; occurrence<counts.total; occurrence++){
      const state = occurrence < counts.correct ? "correct" : "present";
      const item = document.createElement("span");
      item.className = `relevant-letter ${state}`;
      item.textContent = letter;
      item.setAttribute("aria-label", `${letter}, ${state === "correct" ? "correta" : "presente"}, ocorrência ${occurrence + 1} de ${counts.total}`);
      board.relevantEl.appendChild(item);
      items.push({ el:item, state });
    }
    board.relevantLetters.set(letter, items);
  });
}

function revealRow(board, rowIdx, outcome){
  const tiles = board.grid[rowIdx];
  // Revelar em sequência com flip
  outcome.forEach((state, i)=>{
    const tile = tiles[i];
    setTimeout(()=>{
      tile.classList.add("flip");
      setTimeout(()=>{
        tile.classList.remove("flip");
        tile.classList.add(state);
        updateKeyboardKey(tile.textContent, state);
        updateRelevantLetters(board, tile.textContent, state, rowIdx);
      }, 150);
    }, i * 260);
  });
}

/* ===================== FEEDBACK / UI ===================== */
function shakeRow(rowIdx){
  getPlayableBoards().forEach(board => {
    const tiles = board.grid[rowIdx] || [];
    tiles.forEach(t => t.classList.add("shake"));
    setTimeout(()=> tiles.forEach(t => t.classList.remove("shake")), 320);
  });
}

const colorPriority = { "correct":3, "present":2, "absent":1 };
const colorKeyboard = new Map();
function paintKeyboardKey(letter, state){
  const keyBtn = $(`.key[data-key="${letter}"]`);
  const prev = colorKeyboard.get(letter) || "none";
  const prevPrio = colorPriority[prev] || 0;
  if(colorPriority[state] >= prevPrio){
    colorKeyboard.set(letter, state);
    if(keyBtn){
      keyBtn.classList.remove("dark","present","correct","discarded");
      if(state === "absent") keyBtn.classList.add("discarded");
      if(state === "present") keyBtn.classList.add("present");
      if(state === "correct") keyBtn.classList.add("correct");
    }
  }
}
function updateKeyboardKey(letter, state){
  paintKeyboardKey(letter, state);
}
function rebuildKeyboardFromActiveBoards(){
  colorKeyboard.clear();
  $$(".key").forEach(key => key.classList.remove("dark","present","correct","discarded"));
  const sourceBoards = modeCfg().boards > 1 ? getPlayableBoards() : boardsState;
  sourceBoards.forEach(board => {
    board.revealed.forEach(({ guess, outcome }) => {
      for(let i=0; i<WORD_LENGTH; i++){
        const letter = (guess[i] || "").toUpperCase();
        if(!letter) continue;
        paintKeyboardKey(letter, outcome[i]);
      }
    });
  });
}

/* ===================== FIM DE JOGO / ESTATÍSTICAS ===================== */
function endGame(won, tries){
  gameOver = true;
  inputLocked = false;

  stats.games++;
  if(won){
    stats.wins++;
    stats.streak++;
    if(stats.streak > stats.maxStreak) stats.maxStreak = stats.streak;
  }else{
    stats.streak = 0;
  }
  saveStats();

  const dlg = $("#dlgEnd");
  $("#endTitle").textContent = won ? "🎉 Parabéns!" : "💡 Boa tentativa!";
  const answers = boardsState.map(b => b.solution).filter(Boolean);
  const answersText = answers.length > 1 ? answers.join(" e ") : (answers[0] || "");
  $("#endMsg").innerHTML = won
    ? `Você acertou em <b>${tries}</b> ${tries===1 ? "tentativa" : "tentativas"}.`
    : `A${answers.length > 1 ? "s palavras eram" : " palavra era"} <b>${answersText}</b>.`;

  $("#stGames").textContent = stats.games;
  $("#stWins").textContent = stats.wins;
  $("#stStreak").textContent = stats.streak;
  $("#stMax").textContent = stats.maxStreak;

  dlg.showModal();
}

/* ===================== EVENTOS ===================== */
function getColumnShortcut(e){
  const codeMatch = /^(?:Digit|Numpad)([1-5])$/.exec(e.code || "");
  const number = codeMatch ? Number(codeMatch[1]) : (/^[1-5]$/.test(e.key) ? Number(e.key) : 0);
  return number ? number - 1 : null;
}

document.addEventListener("keydown", (e)=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(inputLocked){
    if(
      getColumnShortcut(e) !== null ||
      e.key === "Tab" ||
      e.key === "Enter" ||
      e.key === "Backspace" ||
      e.key === "Delete" ||
      (e.key.length === 1 && isAlphaPt(e.key))
    ){
      e.preventDefault();
    }
    return;
  }
  if(e.key === "Tab"){
    if(!cursorActive){
      currentCol = 0;
      cursorActive = true;
    }else{
      currentCol = (currentCol + 1) % WORD_LENGTH;
    }
    updateCursor();
    e.preventDefault();
    return;
  }
  const shortcutCol = getColumnShortcut(e);
  if(shortcutCol !== null){
    currentCol = shortcutCol;
    cursorActive = true;
    updateCursor();
    e.preventDefault();
    return;
  }
  if(e.key === "Enter" || e.key === "Backspace"){
    if(e.key === "Backspace") flashKey(e.key);
    handleKey(e.key);
    e.preventDefault();
    return;
  }
  if(e.key === "Delete") {
    flashKey("Backspace");
    flipBackspaceSymbol();
    deleteLetter();
    e.preventDefault();
  }
  if(e.key.length === 1 && isAlphaPt(e.key)){
    flashKey(e.key, isDiscardedLetter(e.key) ? "error" : "normal");
    handleKey(e.key);
    e.preventDefault();
  }
});
$("#btnAgain").addEventListener("click", ()=>{
  $("#dlgEnd").close();
  resetGame();
});
$("#btnMode").addEventListener("click", ()=>{
  toggleMode();
});
document.addEventListener("keydown", (e) => {
  if(e.defaultPrevented) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(inputLocked) return;

  // Movimentação com setas
  switch(e.key){
    case "ArrowLeft":
      if(!cursorActive){
        cursorActive = true;
        currentCol = WORD_LENGTH - 1; // última letra
      } else {
        currentCol = (currentCol - 1 + WORD_LENGTH) % WORD_LENGTH;
      }
      updateCursor();
      e.preventDefault();
      return;

    case "ArrowRight":
      if(!cursorActive){
        cursorActive = true;
        currentCol = 0; // primeira letra
      } else {
        currentCol = (currentCol + 1) % WORD_LENGTH;
      }
      updateCursor();
      e.preventDefault();
      return;

    case "ArrowUp":
      if(!cursorActive){
        cursorActive = true;
        currentCol = WORD_LENGTH - 1; // última letra
      } else if(currentCol < WORD_LENGTH - 1){
        currentCol++;
      }
      updateCursor();
      e.preventDefault();
      return;

    case "ArrowDown":
      if(!cursorActive){
        cursorActive = true;
        currentCol = 0; // primeira letra
      } else if(currentCol > 0){
        currentCol--;
      }
      updateCursor();
      e.preventDefault();
      return;
  }
});

// Bloqueia seleção/arraste de texto e elementos (desktop + mobile)
document.addEventListener("selectstart", (e) => {
  e.preventDefault();
});
document.addEventListener("dragstart", (e) => {
  e.preventDefault();
});

/* ===================== START ===================== */
loadStats();
buildKeyboard();
resetGame();
</script>
