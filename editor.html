<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editor de Regras — Mini Termo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  margin:0;
  font-family: system-ui, sans-serif;
  background:#121213;
  color:#e6e6e6;
}
header{
  padding:12px;
  display:flex;
  gap:8px;
  border-bottom:1px solid #333;
}
header .spacer{ flex:1 }
button{
  background:#3a3a3c;
  color:#fff;
  border:0;
  padding:8px 12px;
  border-radius:6px;
  cursor:pointer;
}
button.primary{ background:#6ca0ff }
button:disabled, input:disabled{ opacity:.4; cursor:not-allowed }
main{ padding:16px; max-width:900px; margin:auto }

.notice{
  margin-bottom:16px;
  padding:10px 12px;
  border:1px solid #444;
  border-radius:8px;
  background:#1e1e20;
  white-space:pre-wrap;
}
.notice.error{ border-color:#d85858; background:#351f20; color:#ffb5b5 }
.notice.success{ border-color:#538d4e; background:#1d301f; color:#bce8b8 }
.notice.info{ border-color:#6ca0ff; background:#1b2940; color:#c6d9ff }
.field-error{ margin-top:7px; color:#ff9e9e; font-size:.9rem }
.locked-message{ text-align:center; padding:32px 16px; opacity:.8 }

.rule{
  border:1px solid #333;
  border-radius:8px;
  margin-bottom:12px;
  padding:12px;
}
.rule h3{ margin:0 0 6px 0 }
.rule small{ opacity:.7 }
.rule.rule-target{
  border-color:#6ca0ff;
  box-shadow:0 0 0 2px rgba(108,160,255,.32);
}
.rule-link{
  color:#8db7ff;
  font:inherit;
  font-weight:700;
  text-decoration:underline;
  text-underline-offset:2px;
  cursor:pointer;
}

.items{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:8px;
}
.item{
  background:#2a2a2c;
  padding:4px 8px;
  border-radius:6px;
  display:flex;
  gap:6px;
  align-items:center;
}
.item button{
  background:#ff5c5c;
  padding:2px 6px;
}

.add{
  margin-top:8px;
  display:flex;
  gap:6px;
}

input{
  background:#1e1e20;
  color:#fff;
  border:1px solid #333;
  border-radius:6px;
  padding:6px;
}

.test{
  margin-bottom:24px;
  padding:12px;
  border:1px dashed #444;
  border-radius:8px;
}
</style>
</head>
<body>

<header>
  <button onclick="openTermoFile()">Abrir arquivo HTML</button>
  <span class="spacer"></span>
  <button id="saveButton" class="primary" onclick="saveRules()" disabled>Salvar arquivo</button>
</header>

<main>
  <div id="notice" class="notice info" role="status" aria-live="polite">Abra o arquivo HTML do jogo para começar (sugestão: termo.html).</div>
  <div id="editorContent" hidden>
  <div class="test">
    <h3>Testar palavra</h3>
    <input id="testWord" placeholder="Digite uma palavra">
    <button onclick="test()">Testar</button>
    <div id="testResult"></div>
  </div>

  <div id="rules"></div>
  <div id="wordsEditor"></div>
  </div>
  <div id="lockedMessage" class="locked-message">Nenhuma regra pode ser editada antes de abrir um arquivo HTML válido do jogo.</div>
</main>

<script>
let fileHandle;
let RULES = {};
let WORDS = [];

function showNotice(message, type="info"){
  const notice = document.getElementById("notice");
  notice.textContent = message;
  notice.className = `notice ${type}`;
}

function showFieldError(input, message){
  const addBox = input?.closest(".add");
  if(!addBox) return;
  let error = addBox.nextElementSibling;
  if(!error?.classList.contains("field-error")){
    error = document.createElement("div");
    error.className = "field-error";
    addBox.insertAdjacentElement("afterend", error);
  }
  error.textContent = message;
  input.setAttribute("aria-invalid", "true");
}

function clearFieldError(input){
  input.removeAttribute("aria-invalid");
  const error = input.closest(".add")?.nextElementSibling;
  if(error?.classList.contains("field-error")) error.remove();
}

function showValidationError(input, word, errors){
  const addBox = input?.closest(".add");
  if(!addBox) return;
  let error = addBox.nextElementSibling;
  if(!error?.classList.contains("field-error")){
    error = document.createElement("div");
    error.className = "field-error";
    addBox.insertAdjacentElement("afterend", error);
  }
  error.innerHTML = `A palavra "${word}" não pode ser adicionada.<ul>${errors.map(e => `
    <li><button type="button" class="rule-link" onclick="focusRule('${e.rule}')">${e.rule}</button>${e.item ? ` (${e.item})` : ""}: ${e.message}</li>
  `).join("")}</ul>`;
  input.setAttribute("aria-invalid", "true");
}

function ruleId(key){
  return `rule-${String(key).replace(/[^a-zA-Z0-9_-]/g, "-")}`;
}

function focusRule(key){
  const rule = document.getElementById(ruleId(key));
  if(!rule) return;
  document.querySelectorAll(".rule-target").forEach(el => el.classList.remove("rule-target"));
  rule.classList.add("rule-target");
  rule.scrollIntoView({ behavior:"smooth", block:"center" });
  rule.focus({ preventScroll:true });
  clearTimeout(focusRule._timer);
  focusRule._timer = setTimeout(() => rule.classList.remove("rule-target"), 1800);
}

async function openTermoFile(){
  if(typeof window.showOpenFilePicker !== "function"){
    showNotice("Este navegador não permite abrir arquivos para edição. Use Chrome ou Edge.", "error");
    return;
  }
  let selectedHandle;
  try{
    [selectedHandle] = await window.showOpenFilePicker({
      multiple:false,
      types:[{ description:"Arquivo HTML do Termo", accept:{ "text/html":[".html"] } }]
    });
  }catch(error){
    showNotice(error?.name === "AbortError" ? "A abertura do arquivo foi cancelada." : `Não foi possível abrir o arquivo: ${error?.message || error}`, error?.name === "AbortError" ? "info" : "error");
    return;
  }
  if(!selectedHandle || !selectedHandle.name.toLowerCase().endsWith(".html")){
    showNotice("Arquivo inválido. Selecione um arquivo com extensão .html.", "error");
    return;
  }
  fileHandle = selectedHandle;
  const file = await fileHandle.getFile();
  const text = await file.text();

  const match = text.match(/const RULES = ({[\s\S]*?});/);
  if(!match){
    showNotice(`O arquivo ${file.name} não é um arquivo válido do jogo: RULES não foi encontrado.`, "error");
    return;
  }
  const wordsMatch = text.match(/const WORDS = (\[[\s\S]*?\]);/);
  if(!wordsMatch){
    showNotice(`O arquivo ${file.name} não é um arquivo válido do jogo: WORDS não foi encontrado.`, "error");
    return;
  }

  RULES = eval("(" + match[1] + ")");
  WORDS = eval(wordsMatch[1]);
  document.getElementById("editorContent").hidden = false;
  document.getElementById("lockedMessage").hidden = true;
  document.getElementById("saveButton").disabled = false;
  showNotice(`${file.name} aberto. As regras já podem ser editadas.`, "success");
  render();
}

function render(){
  const c = document.getElementById("rules");
  c.innerHTML = "";

  for(const key in RULES){
    if(Array.isArray(RULES[key])){
      renderListRule(c, key, RULES[key]);
    }else{
      renderSimpleRule(c, key, RULES[key]);
    }
  }

  renderWordsEditor();
}

function renderSimpleRule(container, key, value){
  const d = document.createElement("div");
  d.className = "rule";
  d.id = ruleId(key);
  d.tabIndex = -1;
  d.innerHTML = `
    <h3>${key}</h3>
    <small>Valor simples</small><br>
    <input value="${value}" onchange="RULES['${key}']=this.value">
  `;
  container.appendChild(d);
}

function renderListRule(container, key, list){
  const d = document.createElement("div");
  d.className = "rule";
  d.id = ruleId(key);
  d.tabIndex = -1;

  d.innerHTML = `
    <h3>${key}</h3>
    <small>Lista editável</small>
    <div class="add">
      <input id="add-${key}" placeholder="Novo item" oninput="clearFieldError(this)" onkeydown="handleAddInputKeydown(event,'${key}')">
      <button onclick="addItem('${key}')">Adicionar</button>
    </div>
    <div class="items">
      ${list.map((v,i)=>`
        <div class="item">
          <span>${v}</span>
          <button onclick="removeItem('${key}',${i})">✕</button>
        </div>
      `).join("")}
    </div>
  `;
  container.appendChild(d);
}

function handleAddInputKeydown(e, key){
  if(e.key !== "Enter") return;
  e.preventDefault();
  addItem(key, true);
}

function addItem(key, keepFocus=false){
  const i = document.getElementById("add-"+key);
  if(!i) return;
  const rawValue = i.value.trim();
  if(!rawValue){
    if(keepFocus) i.focus();
    return;
  }

  const value = rawValue.toUpperCase();
  const alreadyExists = RULES[key].some(v => String(v).toUpperCase() === value);
  if(alreadyExists){
    showFieldError(i, `O item "${value}" já existe na regra ${key}.`);
    if(keepFocus){
      i.focus();
      i.select();
    }
    return;
  }

  RULES[key].push(value);
  render();
  if(keepFocus){
    const nextInput = document.getElementById("add-"+key);
    if(nextInput){
      nextInput.focus();
      nextInput.select();
    }
  }
}

function removeItem(key, index){
  RULES[key].splice(index,1);
  render();
}

function renderWordsEditor(){
  const container = document.getElementById("wordsEditor");
  container.innerHTML = "";
  WORDS.sort((a, b) => String(a).localeCompare(String(b), "pt-BR", { sensitivity:"base" }));

  const d = document.createElement("div");
  d.className = "rule";
  d.id = ruleId("WORDS");
  d.tabIndex = -1;
  d.innerHTML = `
    <h3>WORDS</h3>
    <small>Lista de palavras editável (${WORDS.length} itens)</small>
    <div class="add">
      <input id="add-word" placeholder="Nova palavra" oninput="clearFieldError(this)" onkeydown="handleWordInputKeydown(event)">
      <button onclick="addWord()">Adicionar palavra</button>
    </div>
    <div class="items">
      ${WORDS.map((w, i) => `
        <div class="item">
          <span>${w}</span>
          <button onclick="removeWord(${i})">✕</button>
        </div>
      `).join("")}
    </div>
  `;
  container.appendChild(d);
}

function handleWordInputKeydown(e){
  if(e.key !== "Enter") return;
  e.preventDefault();
  addWord(true);
}

function addWord(keepFocus=false){
  const input = document.getElementById("add-word");
  if(!input) return;

  const rawValue = input.value.trim();
  if(!rawValue){
    if(keepFocus){
      input.value = "";
      input.focus();
    }
    return;
  }

  const word = rawValue.toUpperCase();
  const exists = WORDS.some(w => String(w).toUpperCase() === word);
  if(exists){
    showFieldError(input, `A palavra "${word}" já existe em WORDS.`);
    if(keepFocus){
      input.value = "";
      input.focus();
    }
    return;
  }

  const validation = validateWord(word);
  if(!validation.ok){
    showValidationError(input, word, validation.errors);
    if(keepFocus){
      input.value = "";
      input.focus();
    }
    return;
  }

  WORDS.push(word);
  render();
  if(keepFocus){
    const nextInput = document.getElementById("add-word");
    if(nextInput){
      nextInput.value = "";
      nextInput.focus();
    }
  }
}

function removeWord(index){
  WORDS.splice(index, 1);
  render();
}

async function saveRules(){
  if(!fileHandle){
    showNotice("Abra um arquivo HTML válido do jogo antes de salvar.", "error");
    return;
  }
  try{
    const file = await fileHandle.getFile();
    let text = await file.text();

  const MAX_LINE_LEN = 80;

  function formatValue(value, indentLevel){
    if(Array.isArray(value)){
      return formatArray(value, indentLevel);
    }
    if(value && typeof value === "object"){
      return formatObject(value, indentLevel);
    }
    return JSON.stringify(value);
  }

  function formatArray(arr, indentLevel){
    if(arr.length === 0) return "[]";

    const indent = "  ".repeat(indentLevel);
    const childIndent = "  ".repeat(indentLevel + 1);
    const serialized = arr.map(item => formatValue(item, indentLevel + 1));
    const singleLine = `[ ${serialized.join(", ")} ]`;

    if((indent + singleLine).length <= MAX_LINE_LEN){
      return singleLine;
    }

    const lines = [];
    let current = "";
    serialized.forEach(item => {
      const chunk = current ? `, ${item}` : item;
      const candidate = current + chunk;
      if((childIndent + candidate).length <= MAX_LINE_LEN){
        current = candidate;
        return;
      }
      if(current){
        lines.push(current);
      }
      current = item;
    });
    if(current){
      lines.push(current);
    }

    return "[\n" + lines.map(line => `${childIndent}${line}`).join(",\n") + `\n${indent}]`;
  }

  function formatObject(obj, indentLevel){
    const keys = Object.keys(obj);
    if(keys.length === 0) return "{}";

    const indent = "  ".repeat(indentLevel);
    const childIndent = "  ".repeat(indentLevel + 1);
    const lines = keys.map((key) => {
      const valueText = formatValue(obj[key], indentLevel + 1);
      return `${childIndent}${JSON.stringify(key)}: ${valueText}`;
    });

    return "{\n" + lines.join(",\n") + `\n${indent}}`;
  }

  text = text.replace(
    /const RULES = {[\s\S]*?};/,
    "const RULES = " + formatObject(RULES, 0) + ";"
  );
  text = text.replace(
    /const WORDS = \[[\s\S]*?\];/,
    "const WORDS = " + formatArray(WORDS, 0) + ";"
  );

    const w = await fileHandle.createWritable();
    await w.write(text);
    await w.close();

    showNotice(`Regras e WORDS salvos com sucesso em ${fileHandle.name}!`, "success");
  }catch(error){
    showNotice(`Não foi possível salvar ${fileHandle?.name || "o arquivo"}: ${error?.message || error}`, "error");
  }
}

function test(){
  const input = document.getElementById("testWord");
  const word = input.value.trim();
  if(!word) return;

  const res = validateWord(word);
  const out = document.getElementById("testResult");
  const W = word.toUpperCase();

  if(res.ok){
    out.innerHTML = `✅ ${W} = Palavra aceita`;
  }else{
    out.innerHTML = `
      ❌ ${W} = Palavra bloqueada
      <ul>
        ${res.errors.map(e=>`
          <li>
            <button type="button" class="rule-link" onclick="focusRule('${e.rule}')">${e.rule}</button>
            ${e.item ? `(${e.item})` : ""}
            — ${e.message}
          </li>
        `).join("")}
      </ul>
    `;
  }

  input.value = "";
  input.focus();
}

document.getElementById("testWord").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    test();
  }
});

document.getElementById("testWord").addEventListener("input", function(){
  document.getElementById("testResult").innerHTML = "";
});


/* mesmo validador do jogo */
function normalize(s){
  return (s||"").normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/ç/g,"c").replace(/Ç/g,"C");
}

function validateWord(guess){
  const g = normalize(guess).toUpperCase();
  const R = RULES;
  const errors = [];

  if(g.length !== Number(R.length)){
    errors.push({
      rule: "length",
      expected: R.length,
      actual: g.length,
      message: "Tamanho inválido"
    });
  }

  if(R.requireVowel && !/[AEIOU]/.test(g)){
    errors.push({
      rule: "requireVowel",
      message: "A palavra precisa conter ao menos uma vogal"
    });
  }

  if(R.forbiddenLetters){
    R.forbiddenLetters.forEach(l=>{
      if(g.includes(l)){
        errors.push({
          rule: "forbiddenLetters",
          item: l,
          message: `Letra proibida: ${l}`
        });
      }
    });
  }

  if(R.qMustHaveU){
    for(let i=0;i<g.length;i++){
      if(g[i] === "Q"){
        const next = g[i+1];
        const next2 = g[i+2];

        if(next !== "U"){
          errors.push({
            rule: "qMustHaveU",
            item: "Q",
            index: i,
            message: "Q deve ser seguido de U"
          });
        } 
        else if(!/[AEIO]/.test(next2)){
          errors.push({
            rule: "qMustHaveU",
            item: "QU",
            index: i,
            message: "Depois de QU deve vir A, E, I ou O (não U ou outra letra)"
          });
        }
      }
    }
  }

  if(R.forbiddenSequences){
    R.forbiddenSequences.forEach(seq=>{
      const idx = g.indexOf(seq);
      if(idx !== -1){
        errors.push({
          rule: "forbiddenSequences",
          item: seq,
          index: idx,
          message: `Sequência proibida: ${seq}`
        });
      }
    });
  }

  if(R.allowedDouble){
    for(let i=0;i<g.length-1;i++){
      if(g[i] === g[i+1]){
        const pair = g[i]+g[i+1];
        if(!R.allowedDouble.includes(pair)){
          errors.push({
            rule: "allowedDouble",
            item: pair,
            index: i,
            message: `Letra dupla não permitida: ${pair}`
          });
        }
      }
    }
  }

  if(R.allowedClusters){
    for(let i=0;i<g.length-1;i++){
      const a = g[i], b = g[i+1];
      const isACons = !/[AEIOU]/.test(a);
      const isBCons = !/[AEIOU]/.test(b);

      if(isACons && isBCons){
        const pair = a+b;

        const allowed =
          R.allowedClusters.includes(pair) ||
          R.allowedDouble?.includes(pair) ||
          ["CH","LH","NH"].includes(pair);

        if(!allowed){
          errors.push({
            rule: "allowedClusters",
            item: pair,
            index: i,
            message: `Encontro consonantal não permitido: ${pair}`
          });
        }
      }
    }
  }

  if(R.forbiddenEnd){
    R.forbiddenEnd.forEach(end=>{
        if(g.endsWith(end)){
        errors.push({
            rule: "forbiddenEnd",
            item: end,
            message: `Palavra não pode terminar com ${end}`
        });
        }
    });
    }


  if(R.bannedWords?.includes(g)){
    errors.push({
      rule: "bannedWords",
      item: g,
      message: "Palavra explicitamente proibida"
    });
  }

  return {
    ok: errors.length === 0,
    errors
  };
}

</script>
</body>
</html>
